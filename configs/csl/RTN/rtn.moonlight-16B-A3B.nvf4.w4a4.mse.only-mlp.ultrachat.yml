base:
    seed: &seed 42
model:
    type: DeepseekV3
    path: /nfs/FM/chenshuailin/checkpoints/moonshotai/Moonlight-16B-A3B-Instruct
    tokenizer_mode: fast
    torch_dtype: torch.bfloat16
    # calibrate_all_experts: True
calib:
    name: ultrachat
    path: data/ultrachat
    preproc: ultrachat_general
    download: False
    n_samples: 128
    seq_len: 2048
    seed: *seed
    bs: 1
ignored_layers:
    block_ids: ["0-999"]
    layer_names:
        - self_attn.q_proj
        - self_attn.k_proj
        - self_attn.v_proj
        - self_attn.q_a_proj
        - self_attn.q_b_proj
        - self_attn.kv_a_proj_with_mqa
        - self_attn.kv_b_proj
        - self_attn.o_proj
quant:
    method: RTN
    weight:
        quant_type: nvfp4
        bit: 4
        symmetric: True
        granularity: per_group
        group_size: 16
        share_global_scale: True
        calib_algo: mse
    act:
        quant_type: nvfp4
        bit: 4
        symmetric: True
        granularity: per_group
        group_size: 16
        share_global_scale: True
        calib_algo: static_minmax
        static: True
        check_global_scale: False
    special:
        # actorder: True
        # static_groups: True
        # percdamp: 0.05
        # blocksize: 128
        # chunk_num: 1
        true_sequential: True
        # online_rotate: True
        # fp32_had: False
        # online_rotate_exclude: ["o_proj"]
        # eager_transform_dtype: True
        # force_scale_dtype: True
    quant_out: True
save:
    # save_fake: True
    # save_vllm: True
    # save_autoawq: True
    save_vllm_nvfp4: True
    save_path: checkpoints/Moonlight-16B-A3B-Instruct/RTN/nvf4_w4a4_mse_sgs_only_mlp_ultrachat
dispatch:
    num_gpus: 1
    # first_gpu_extra_margin: 0.6
    # safe_margin: 0.9